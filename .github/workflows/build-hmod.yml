name: Build Hold My Items packages

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  package:
    name: Build HMod and resource pack (Ubuntu x86_64)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-horizon-mod
        run: cargo install --locked --git https://github.com/horizon-rust/horizon cargo-horizon-mod

      - name: Build HMod package
        run: cargo horizon-mod build

      - name: Package resource pack
        run: |
          set -euo pipefail
          test -s resourcepack/pack.mcmeta
          test -d resourcepack/assets/minecraft
          mkdir -p target/packages
          (cd resourcepack && zip -qr ../packages/holdmyitems-resourcepack.zip .)
          test -s target/packages/holdmyitems-resourcepack.zip

      - name: Verify outputs
        run: |
          set -euo pipefail
          test -s target/horizon-mod/holdmyitems.hmod
          unzip -l target/packages/holdmyitems-resourcepack.zip | grep -q 'assets/minecraft/items/'
          unzip -l target/packages/holdmyitems-resourcepack.zip | grep -q 'pack.mcmeta'

      - name: Upload HMod
        uses: actions/upload-artifact@v4
        with:
          name: holdmyitems-hmod
          path: target/horizon-mod/holdmyitems.hmod
          if-no-files-found: error
          retention-days: 14

      - name: Upload resource pack
        uses: actions/upload-artifact@v4
        with:
          name: holdmyitems-resourcepack
          path: target/packages/holdmyitems-resourcepack.zip
          if-no-files-found: error
          retention-days: 14
