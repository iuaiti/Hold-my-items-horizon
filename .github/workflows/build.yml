name: Build Hold My Items (Horizon v0.2)

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      sdk_api_source_url:
        description: "Override download URL for Horizon v0.2 api-source.tar.xz (leave empty to use official GitHub Release)"
        required: false
        default: ""

permissions:
  contents: write

env:
  MOD_ID: holdmyitems
  MOD_VERSION: "5.1.1"
  RUST_VERSION: "1.99.1"
  SDK_COMMIT: "f00125f61f794aaa3d4e950d301f353b35b6ee3d"
  DEFAULT_SDK_URL: "https://github.com/horizon-rust/horizon/releases/download/sdk-f00125f61f794aaa3d4e950d301f353b35b6ee3d/api-source.tar.xz"
  API_SOURCE_SHA256: "5bed678f76130a6dea6cb2adebf3204168f9ab0350cd92c0ede160ac6b0d45d7"
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build & Package Official .hmod (Wasm)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust ${{ env.RUST_VERSION }}
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: wasm32-unknown-unknown
          components: clippy, rust-src

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2

      - name: Cache cargo-horizon-mod CLI (${{ env.SDK_COMMIT }})
        id: cache-cli
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/cargo-horizon-mod
          key: cargo-horizon-mod-${{ runner.os }}-${{ env.SDK_COMMIT }}

      - name: Install cargo-horizon-mod (${{ env.SDK_COMMIT }})
        if: steps.cache-cli.outputs.cache-hit != 'true'
        run: |
          cargo install --locked --git https://github.com/horizon-rust/horizon --rev "${SDK_COMMIT}" cargo-horizon-mod

      - name: Prepare Horizon v0.2 SDK (api-source)
        env:
          SDK_URL: ${{ github.event.inputs.sdk_api_source_url || vars.HORIZON_API_SOURCE_URL || env.DEFAULT_SDK_URL }}
        run: |
          set -euo pipefail
          SDK_DIR="../api-source"
          if [ ! -d "${SDK_DIR}/crates/horizon-mod-api" ]; then
            if [ -d "./api-source/crates/horizon-mod-api" ]; then
              ln -s "${PWD}/api-source" "${SDK_DIR}"
            elif [ -f "./api-source.tar.xz" ]; then
              mkdir -p "${SDK_DIR}"
              echo "${API_SOURCE_SHA256}  ./api-source.tar.xz" | sha256sum -c -
              tar -xmJf ./api-source.tar.xz -C "${SDK_DIR}"
            else
              echo "Downloading Horizon v0.2 api-source.tar.xz from ${SDK_URL}..."
              curl -fSL "${SDK_URL}" -o /tmp/api-source.tar.xz
              echo "${API_SOURCE_SHA256}  /tmp/api-source.tar.xz" | sha256sum -c -
              mkdir -p "${SDK_DIR}"
              tar -xmJf /tmp/api-source.tar.xz -C "${SDK_DIR}"
            fi
          fi

      - name: Ensure exact [wasm] manifest section for SDK ${{ env.SDK_COMMIT }}
        run: |
          set -euo pipefail
          if ! grep -q '^\[wasm\]' horizon-mod.toml; then
            TMP_SAMPLE="$(mktemp -d)"
            cargo horizon-mod new "${TMP_SAMPLE}/probe" --template wasm --horizon "${SDK_COMMIT}"
            echo "=== Generated reference horizon-mod.toml ==="
            cat "${TMP_SAMPLE}/probe/horizon-mod.toml"
            python3 - "${TMP_SAMPLE}/probe/horizon-mod.toml" horizon-mod.toml <<'PY'
          import sys
          with open(sys.argv[1]) as f:
              ref = f.read()
          idx = ref.find("[wasm]")
          if idx == -1:
              idx = ref.find("[native]")
          if idx != -1:
              section = ref[idx:].strip()
              with open(sys.argv[2], "a") as out:
                  out.write("\n" + section + "\n")
          PY
            echo "=== Final horizon-mod.toml ==="
            cat horizon-mod.toml
          fi

      - name: Run Clippy (warnings only)
        run: cargo clippy -p holdmyitems --all-targets

      - name: Build & verify official .hmod via cargo horizon-mod
        run: |
          set -euo pipefail
          cargo horizon-mod build --wasm
          mkdir -p dist
          HMOD_SRC="target/horizon-mod/${MOD_ID}.hmod"
          HMOD_OUT="dist/${MOD_ID}-${MOD_VERSION}-horizon-v0.2.hmod"
          cp "${HMOD_SRC}" "${HMOD_OUT}"
          cargo horizon-mod check "${HMOD_OUT}"
          ls -lh dist/

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.MOD_ID }}-horizon-v0.2-${{ env.SDK_COMMIT }}
          path: dist/*
          retention-days: 30

  release:
    name: Publish GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.MOD_ID }}-horizon-v0.2-${{ env.SDK_COMMIT }}
          path: dist

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/*
