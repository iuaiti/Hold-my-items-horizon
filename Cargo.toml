[package]
name = "holdmyitems"
version = "5.1.1"
edition = "2024"
description = "Hold My Items 5.1.1 (.hmod) for Horizon (Minecraft 26.3): first-person hand & item physics, 3D block/item poses, per-quad model articulation, inspection, particles, and dynamic hand lighting."
license = "MIT"

[lib]
path = "src/lib.rs"

[dependencies]
